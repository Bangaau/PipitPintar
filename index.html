<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pipit Huruf - Main, Dengar, Kenal, dan Ingat Huruf!</title>
  <style>
    /* CSS RESET & VARIABLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-color: #f0f8ff;
      --card-bg: #ffffff;
      --primary-blue: #4a90e2;
      --primary-blue-light: #e6f0fa;
      --mint-green: #50e3c2;
      --mint-light: #e8fcf7;
      --soft-yellow: #ffcf48;
      --yellow-light: #fff9e6;
      --peach: #ff9f76;
      --peach-light: #fff1eb;
      --lavender: #b19ffb;
      --lavender-light: #f3f0fe;
      --text-dark: #2c3e50;
      --text-muted: #7f8c8d;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --font-family: 'Arial Rounded MT Bold', 'Fredoka', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: #dbeafe;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* MAIN CONTAINER (MOBILE FRAME ON DESKTOP) */
    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 920px;
      background-color: var(--bg-color);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    @media (min-width: 500px) {
      #app-container {
        border-radius: 36px;
        height: 95vh;
        border: 8px solid #ffffff;
      }
    }

    /* HEADER BAR */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      z-index: 10;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--primary-blue);
      font-size: 1.1rem;
    }

    .brand-icon {
      font-size: 1.5rem;
      animation: miniBounce 2s infinite;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      border: 1px solid #e2e8f0;
    }

    .parent-btn {
      background: var(--lavender-light);
      border: none;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: #6b21a8;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }

    .parent-btn:active {
      transform: scale(0.95);
    }

    /* VIEW CANVAS */
    .view-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 90px 18px;
      scroll-behavior: smooth;
    }

    /* FLOATING BOTTOM NAV */
    .bottom-nav {
      position: absolute;
      bottom: 16px;
      left: 18px;
      right: 18px;
      height: 64px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: bold;
      width: 22%;
      height: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 20px;
    }

    .nav-item .nav-icon {
      font-size: 1.4rem;
      margin-bottom: 2px;
      transition: transform 0.2s ease;
    }

    .nav-item.active {
      color: var(--primary-blue);
    }

    .nav-item.active .nav-icon {
      transform: translateY(-2px) scale(1.15);
    }

    /* CARD STYLING */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 2px solid #ffffff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(74, 144, 226, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s ease;
      min-height: 52px;
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(74, 144, 226, 0.2);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text-dark);
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 48px;
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    /* SPLASH SCREEN */
    #splash-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #e0f2fe, #bae6fd);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      text-align: center;
      padding: 24px;
    }

    .splash-bird {
      font-size: 5rem;
      animation: float 2.5s ease-in-out infinite;
      margin-bottom: 16px;
    }

    .splash-title {
      font-size: 2.2rem;
      color: var(--primary-blue);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .splash-tagline {
      font-size: 1rem;
      color: #0369a1;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .loader-dots {
      display: flex;
      gap: 8px;
    }

    .loader-dot {
      width: 12px;
      height: 12px;
      background: var(--primary-blue);
      border-radius: 50%;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }

    /* ONBOARDING */
    .onboard-card {
      text-align: center;
      padding: 30px 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .onboard-icon {
      font-size: 5rem;
      margin-bottom: 24px;
      animation: pop 0.5s ease;
    }

    .onboard-title {
      font-size: 1.6rem;
      color: var(--primary-blue);
      margin-bottom: 12px;
    }

    .onboard-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
    }

    /* HOME SCREEN */
    .mascot-card {
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
      border: 2px solid #bae6fd;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }

    .mascot-avatar {
      font-size: 3.2rem;
      background: #ffffff;
      padding: 10px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      animation: miniBounce 3s infinite;
    }

    .mascot-speech {
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #0284c7;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .progress-container {
      margin-top: 10px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      height: 14px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .menu-card:active {
      transform: scale(0.96);
    }

    .menu-card.blue { border-color: #bfdbfe; background: #eff6ff; }
    .menu-card.green { border-color: #bbf7d0; background: #f0fdf4; }
    .menu-card.yellow { border-color: #fef08a; background: #fefce8; }
    .menu-card.purple { border-color: #ddd6fe; background: #faf5ff; }
    .menu-card.peach { border-color: #fed7aa; background: #fff7ed; }

    .menu-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .menu-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-dark);
    }

    .banner-learn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
      margin-bottom: 16px;
    }

    .banner-learn:active {
      transform: scale(0.98);
    }

    /* GRID BELAJAR HURUF */
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .letter-card {
      aspect-ratio: 1;
      background: white;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary-blue);
      box-shadow: var(--shadow-sm);
      border: 2px solid #e2e8f0;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }

    .letter-card:active {
      transform: scale(0.92);
    }

    .letter-card.learned {
      background: #f0fdf4;
      border-color: #86efac;
      color: #16a34a;
    }

    .letter-card .badge-check {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.75rem;
    }

    /* DETAIL HURUF VIEW */
    .detail-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .big-letter-box {
      width: 100%;
      background: linear-gradient(135deg, #ffffff, #f0f9ff);
      border-radius: 32px;
      padding: 30px 20px;
      border: 4px solid #bae6fd;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .letter-display {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--primary-blue);
      line-height: 1;
      margin-bottom: 10px;
    }

    .letter-display span {
      color: #f59e0b;
      font-size: 3.5rem;
      margin-left: 6px;
    }

    .word-display {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-top: 8px;
    }

    .emoji-display {
      font-size: 5rem;
      margin: 12px 0;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .audio-btn {
      background: #f59e0b;
      color: white;
      border: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s ease;
    }

    .audio-btn:active {
      transform: scale(0.9);
    }

    .nav-arrow-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    /* GAME COMPONENTS */
    .game-prompt {
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
      color: var(--text-dark);
      margin-bottom: 16px;
    }

    .game-choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .choice-card {
      background: white;
      border: 3px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 20px;
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-height: 90px;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .choice-card:active {
      transform: scale(0.95);
    }

    .choice-card.correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
      animation: bounce 0.5s ease;
    }

    .choice-card.wrong {
      animation: shake 0.4s ease;
      background: #fee2e2;
      border-color: #ef4444;
    }

    /* CARI HURUF GRID */
    .find-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .find-item {
      aspect-ratio: 1;
      background: white;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-md);
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .find-item.found {
      background: #bbf7d0;
      border-color: #22c55e;
      color: #15803d;
      transform: scale(0.95);
    }

    /* MATCH GAME STYLES */
    .match-columns {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 48%;
    }

    .match-card {
      background: white;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }

    .match-card.selected {
      border-color: var(--primary-blue);
      background: var(--primary-blue-light);
    }

    .match-card.matched {
      background: #dcfce7;
      border-color: #22c55e;
      color: #16a34a;
      cursor: default;
    }

    /* BADGES / HADIAHKU */
    .badge-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .badge-card {
      background: white;
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 2px solid #e2e8f0;
      box-shadow: var(--shadow-sm);
    }

    .badge-card.locked {
      opacity: 0.5;
      background: #f8fafc;
      filter: grayscale(1);
    }

    .badge-icon {
      font-size: 2.5rem;
      margin-bottom: 6px;
    }

    .badge-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .badge-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* PARENT DASHBOARD */
    .parent-stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .parent-stat-box {
      background: white;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .parent-stat-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-blue);
    }

    .parent-stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* MODAL */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 500;
    }

    .modal-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: var(--shadow-md);
      animation: pop 0.3s ease;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-sm);
      text-align: center;
      margin-bottom: 16px;
    }

    /* ANIMATIONS */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes miniBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-12px); }
      60% { transform: translateY(-6px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* CONFETTI LAYER */
    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
      <div class="splash-bird">🐦</div>
      <h1 class="splash-title">PIPIT HURUF</h1>
      <p class="splash-tagline">“Main, Dengar, Kenal, dan Ingat Huruf!”</p>
      <div class="loader-dots">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>

    <!-- HEADER BAR -->
    <div class="header-bar" id="header-bar" style="display: none;">
      <div class="brand-mini">
        <span class="brand-icon">🐦</span>
        <span>Pipit</span>
      </div>
      <div class="stats-group">
        <div class="stat-badge">⭐ <span id="star-count">0</span></div>
        <div class="stat-badge">💎 <span id="gem-count">0</span></div>
        <div class="stat-badge">🔥 <span id="streak-count">1</span></div>
        <button class="parent-btn" onclick="openParentGate()">👨‍👩‍👧</button>
      </div>
    </div>

    <!-- VIEW CANVAS -->
    <div class="view-content" id="view-canvas"></div>

    <!-- FLOATING BOTTOM NAV -->
    <nav class="bottom-nav" id="bottom-nav" style="display: none;">
      <button class="nav-item active" id="nav-home" onclick="navigateTo('home')">
        <span class="nav-icon">🏠</span>
        <span>Beranda</span>
      </button>
      <button class="nav-item" id="nav-learn" onclick="navigateTo('learn')">
        <span class="nav-icon">📖</span>
        <span>Belajar</span>
      </button>
      <button class="nav-item" id="nav-game" onclick="navigateTo('game_menu')">
        <span class="nav-icon">🎮</span>
        <span>Game</span>
      </button>
      <button class="nav-item" id="nav-rewards" onclick="navigateTo('rewards')">
        <span class="nav-icon">🏆</span>
        <span>Hadiah</span>
      </button>
    </nav>

    <!-- MODAL CONTAINER -->
    <div id="modal-container"></div>
  </div>

  <script>
    /* ALPHABET DATA */
    const ALPHABET = [
      { letter: 'A', lower: 'a', word: 'Apel', emoji: '🍎' },
      { letter: 'B', lower: 'b', word: 'Bola', emoji: '⚽' },
      { letter: 'C', lower: 'c', word: 'Cicak', emoji: '🦎' },

    /* CONFETTI ANIMATION */
    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      const particles = [];
      const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.3,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 3 + 2
        });
      }

      let duration = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        duration++;
        if (duration < 60) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    function selectMatchRight(letter) {
      if (!matchSession.selectedLeft) return;

      const rightCard = document.getElementById(`right-${letter}`);
      if (rightCard.classList.contains('matched')) return;

      if (matchSession.selectedLeft === letter) {
        const leftCard = document.getElementById(`left-${letter}`);
        leftCard.classList.remove('selected');
        leftCard.classList.add('matched');
        rightCard.classList.add('matched');
        
        matchSession.matchedCount++;
        speak('Cocok!');

        if (matchSession.matchedCount >= 4) {
          triggerConfetti();
          state.stars += 2;
          state.correctGames += 1;
          saveState();

          document.getElementById('match-feedback').innerHTML = `<span style="color:#16a34a; font-size:1.2rem;">🎉 Yeay! Pasangan Huruf Selesai! 🎉</span>`;
          speak('Yeay! Kamu berhasil memasangkan semua huruf!');

          setTimeout(() => {
            renderGameMatch(document.getElementById('view-canvas'));
          }, 2200);
        }
      } else {
        rightCard.style.animation = 'shake 0.4s';
        speak('Coba cari pasangan lain!');
        setTimeout(() => rightCard.style.animation = '', 400);
      }
    }

    /* GAME 4: HURUF AWAL */
    let firstSession = { currentRound: 1, target: null };

    function renderGameFirstLetter(container) {
      if (firstSession.currentRound > 10) {
        renderGameSummary(container, "🎯 Huruf Awal");
        return;
      }

      const targetObj = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
      firstSession.target = targetObj;

      const wrongChoices = ALPHABET.filter(a => a.letter !== targetObj.letter)
                                  .sort(() => 0.5 - Math.random())
                                  .slice(0, 3);
      const choices = [targetObj, ...wrongChoices].sort(() => 0.5 - Math.random());

      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:0.85rem; font-weight:bold; color:var(--text-muted);">Ronde ${firstSession.currentRound} / 10</span>
          <button class="btn-secondary" style="padding:6px 12px; font-size:0.8rem;" onclick="navigateTo('game_menu')">Keluar</button>
        </div>

        <div class="card" style="text-align:center;">
          <div style="font-size:4.5rem; margin-bottom:8px;">${targetObj.emoji}</div>
          <div class="game-prompt">“${targetObj.word}” dimulai dengan huruf apa?</div>
        </div>

        <div class="game-choices-grid">
          ${choices.map((c, idx) => `
            <div class="choice-card" id="first-choice-${idx}" onclick="checkFirstChoice(${idx}, '${c.letter}')">
              ${c.letter}
            </div>
          `).join('')}
        </div>

        <div id="first-feedback" style="margin-top:16px; text-align:center; font-weight:bold; min-height:40px;"></div>
      `;

      speak(`${targetObj.word} dimulai dengan huruf apa?`);
    }

    function checkFirstChoice(index, letter) {
      const card = document.getElementById(`first-choice-${index}`);
      const feedback = document.getElementById('first-feedback');

      if (letter === firstSession.target.letter) {
        card.classList.add('correct');
        feedback.innerHTML = `<span style="color:#16a34a; font-size:1.2rem;">✨ Keren! ${letter} untuk ${firstSession.target.word}! ✨</span>`;
        speak(`Keren! ${letter} untuk ${firstSession.target.word}!`);
        
        triggerConfetti();
        state.stars += 1;
        state.correctGames += 1;
        saveState();

        setTimeout(() => {
          firstSession.currentRound++;
          renderGameFirstLetter(document.getElementById('view-canvas'));
        }, 1800);
      } else {
        card.classList.add('wrong');
        feedback.innerHTML = `<span style="color:#dc2626;">Hampir benar. Coba lagi ya! 😊</span>`;
        speak('Hampir benar. Coba lagi ya!');
        setTimeout(() => card.classList.remove('wrong'), 800);
      }
    }

    /* GAME SUMMARY */
    function renderGameSummary(container, title) {
      container.innerHTML = `
        <div class="card" style="text-align:center; padding:30px 20px;">
          <div style="font-size:4rem; margin-bottom:12px;">🎉</div>
          <h2 style="font-size:1.6rem; color:var(--primary-blue); margin-bottom:8px;">HEBAT BANGET!</h2>
          <p style="font-size:1rem; color:var(--text-muted); margin-bottom:20px;">Kamu berhasil menyelesaikan ${title}!</p>
          
          <div style="font-size:1.3rem; font-weight:bold; color:var(--text-dark); margin-bottom:24px;">
            Hadiah Bintang: ⭐ +10
          </div>

          <button class="btn-primary" style="margin-bottom:12px;" onclick="resetAndPlayAgain('${title}')">MAIN LAGI 🔄</button>
          <button class="btn-secondary" style="width:100%;" onclick="navigateTo('home')">KEMBALI KE HOME 🏠</button>
        </div>
      `;

      state.stars += 10;
      state.gems += 1;
      saveState();
      speak("Hebat banget! Kamu menyelesaikan permainan!");
    }

    function resetAndPlayAgain(title) {
      if (title.includes("Tebak")) { guessSession.currentRound = 1; navigateTo('game_guess'); }
      else if (title.includes("Awal")) { firstSession.currentRound = 1; navigateTo('game_first_letter'); }
    }

    /* REWARDS / HADIAHKU */
    function renderRewards(container) {
      let badgeCards = BADGES.map(b => {
        const unlocked = isBadgeUnlocked(b);
        return `
          <div class="badge-card ${unlocked ? '' : 'locked'}">
            <div class="badge-icon">${unlocked ? b.name.split(' ')[0] : '🔒'}</div>
            <div class="badge-name">${b.name}</div>
            <div class="badge-desc">${b.desc}</div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div style="text-align:center; margin-bottom: 16px;">
          <h2 style="font-size:1.4rem; color:var(--primary-blue);">🏆 Hadiahku</h2>
          <p style="font-size:0.85rem; color:var(--text-muted);">Koleksi bintang dan pialamu di sini!</p>
        </div>

        <div class="card" style="display:flex; justify-content:space-around; text-align:center;">
          <div>
            <div style="font-size:2rem;">⭐</div>
            <div style="font-size:1.2rem; font-weight:bold;">${state.stars}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">Total Bintang</div>
          </div>
          <div>
            <div style="font-size:2rem;">💎</div>
            <div style="font-size:1.2rem; font-weight:bold;">${state.gems}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">Total Berlian</div>
          </div>
        </div>

        <h3 style="font-size:1rem; margin: 16px 0 10px 4px; color:var(--text-muted);">LENCANA PENGHARGAAN</h3>
        <div class="badge-grid">
          ${badgeCards}
        </div>
      `;
    }

    function isBadgeUnlocked(b) {
      if (b.reqType === 'learned') return state.learned.length >= b.reqNum;
      if (b.reqType === 'correct') return state.correctGames >= b.reqNum;
      return false;
    }

    function checkBadges() {
      BADGES.forEach(b => {
        if (isBadgeUnlocked(b) && !state.badges.includes(b.id)) {
          state.badges.push(b.id);
          saveState();
        }
      });
    }

    /* PARENT MODE GATE & DASHBOARD */
    function openParentGate() {
      const num1 = Math.floor(Math.random() * 5) + 1;
      const num2 = Math.floor(Math.random() * 4) + 1;
      const ans = num1 + num2;

      const modalContainer = document.getElementById('modal-container');
      modalContainer.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-card">
            <div class="modal-title">👨‍👩‍👧 Area Orang Tua / Guru</div>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">Selesaikan soal matematika untuk masuk:</p>
            <div style="font-size:1.4rem; font-weight:bold; margin-bottom:12px;">${num1} + ${num2} = ?</div>
            <input type="number" id="gate-answer" class="modal-input" placeholder="Jawaban">
            <div style="display:flex; gap:8px;">
              <button class="btn-secondary" style="flex:1" onclick="closeModal()">Batal</button>
              <button class="btn-primary" style="flex:1" onclick="verifyParentGate(${ans})">Masuk</button>
            </div>
          </div>
        </div>
      `;
    }

    function verifyParentGate(correctAns) {
      const val = parseInt(document.getElementById('gate-answer').value);
      if (val === correctAns) {
        closeModal();
        navigateTo('parents');
      } else {
        alert("Jawaban belum tepat!");
      }
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function renderParentDashboard(container) {
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 style="font-size:1.3rem; color:var(--primary-blue);">👨‍👩‍👧 Area Orang Tua</h2>
          <button class="btn-secondary" style="padding:6px 12px; font-size:0.8rem;" onclick="navigateTo('home')">Tutup</button>
        </div>

        <div class="parent-stat-row">
          <div class="parent-stat-box">
            <div class="parent-stat-num">${state.learned.length} / 26</div>
            <div class="parent-stat-label">Huruf Dikenal</div>
          </div>
          <div class="parent-stat-box">
            <div class="parent-stat-num">⭐ ${state.stars}</div>
            <div class="parent-stat-label">Total Bintang</div>
          </div>
        </div>

        <div class="card">
          <h3 style="font-size:0.95rem; margin-bottom:10px;">Status Pengenalan Huruf</h3>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${ALPHABET.map(a => {
              const learned = state.learned.includes(a.letter);
              return `<span style="padding:4px 8px; border-radius:6px; font-size:0.8rem; font-weight:bold; background:${learned ? '#dcfce7' : '#f1f5f9'}; color:${learned ? '#15803d' : '#94a3b8'};">${a.letter}</span>`;
            }).join('')}
          </div>
        </div>

        <div class="card" style="border: 2px solid #fee2e2; background:#fff5f5;">
          <h3 style="font-size:0.95rem; color:#dc2626; margin-bottom:6px;">Reset Progress</h3>
          <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">Hapus semua bintang dan statistik belajar anak untuk memulai ulang.</p>
          <button class="btn-secondary" style="background:#ef4444; color:white;" onclick="confirmResetProgress()">RESET PROGRESS BELAJAR</button>
        </div>

        <div style="text-align:center; font-size:0.75rem; color:var(--text-muted); margin-top:20px;">
          Pipit Huruf by <strong>PipitPintar</strong><br>
          Media Edukasi Anak untuk PAUD, TK & SD
        </div>
      `;
    }

    function confirmResetProgress() {
      const modalContainer = document.getElementById('modal-container');
      modalContainer.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-card">
            <div class="modal-title" style="color:#dc2626;">⚠️ Hapus Progress?</div>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:16px;">Yakin ingin menghapus semua perkembangan belajar? Data tidak bisa dikembalikan.</p>
            <div style="display:flex; gap:8px;">
              <button class="btn-secondary" style="flex:1" onclick="closeModal()">BATAL</button>
              <button class="btn-primary" style="flex:1; background:#ef4444;" onclick="executeResetProgress()">HAPUS ALL</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeResetProgress() {
      localStorage.removeItem('pipitHurufState');
      state = {
        stars: 0,
        gems: 0,
        streak: 1,
        learned: [],
        badges: [],
        gamesPlayed: 0,
        correctGames: 0,
        onboarded: true,
        currentView: 'home',
        currentDetailIndex: 0
      };
      saveState();
      closeModal();
      navigateTo('home');
    }
  </script>
</body>
</html>
