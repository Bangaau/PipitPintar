    // ============================================================
    // GAME 1: GUESS LETTER
    // ============================================================
    function buildGuessQuestions() {
      const targets = shuffleArray(LETTERS).slice(0, 10);
      return targets.map(target => {
        const wrong = randomLetters(3, [target.letter]);
        return {
          target: target.letter,
          options: shuffleArray([target.letter, ...wrong]),
          attempts: 0
        };
      });
    }

    function startGuessGame() {
      runtime.guess = {
        index: 0,
        score: 0,
        questions: buildGuessQuestions(),
        finished: false,
        rewardStars: 0
      };
      navigateTo("guess");
    }

    function guessQuestionAudio() {
      if (!runtime.guess || runtime.guess.finished) return [];
      const q = runtime.guess.questions[runtime.guess.index];
      const item = getLetter(q.target);
      const i = runtime.guess.index;
      if (i === 0) {
        return [
          { text: "Dengarkan, ya.", pause: 400, style: "instruction" },
          { text: `Mana huruf ${item.pronunciation}?`, pause: 0, style: "instruction" }
        ];
      }
      const text = i % 3 === 1
        ? `Sekarang, cari huruf ${item.pronunciation}.`
        : i % 3 === 2
          ? `Coba pilih huruf ${item.pronunciation}.`
          : `Mana huruf ${item.pronunciation}?`;
      return [{ text, pause: 0, style: "instruction" }];
    }

    function renderGuessGame() {
      const game = runtime.guess;
      if (!game) return renderMissingGame("Tebak Huruf", "start-guess");
      if (game.finished) return renderGameResult("guess", game.score, 10, game.rewardStars);
      const q = game.questions[game.index];
      const item = getLetter(q.target);
      return `
        <section class="page">
          <div class="top-row">
            <button class="back-btn" data-action="nav" data-view="games" aria-label="Kembali ke menu game">←</button>
            <strong>🔤 Tebak Huruf</strong>
            <button class="speaker" data-action="guess-speak" aria-label="Dengarkan soal" aria-pressed="false">🔊</button>
          </div>
          ${renderGameProgress(game.index + 1, 10)}
          <div class="card question-card sky">
            <div class="mascot small" style="margin:0 auto 14px" aria-hidden="true">🐦</div>
            <div class="question-kicker">Dengarkan, ya</div>
            <div class="question-text">Mana huruf <span aria-label="${item.pronunciation}">${item.letter}</span>?</div>
            <div class="subtle">Yuk, pilih jawabannya!</div>
          </div>
          <div class="answer-grid">
            ${q.options.map(letter => `<button class="answer-btn" data-action="guess-answer" data-letter="${letter}" aria-label="Huruf ${getLetter(letter).pronunciation}">${letter}</button>`).join("")}
          </div>
        </section>
      `;
    }

    async function handleGuessAnswer(letter, button) {
      const game = runtime.guess;
      if (!game || game.finished || runtime.isTransitioning) return;
      const q = game.questions[game.index];
      if (!q) return;
      const token = runtime.viewToken;

      if (letter === q.target) {
        runtime.isTransitioning = true;
        document.querySelectorAll(".answer-btn").forEach(b => b.disabled = true);
        if (button) button.classList.add("correct");
        game.score += 1;
        game.rewardStars += 1;
        addStars(1);
        addCorrect(1);
        updateBadges();
        createCelebration(12);
        stopAudio();
        await delay(300);
        if (runtime.viewToken !== token || runtime.currentView !== "guess") return;

        const target = getLetter(q.target);
        const feedback = randomItem(["Hebat!", "Pintar!", "Benar!", "Keren!", "Bagus sekali!", "Yeay, benar!"]);
        await audioManager.playSequence([
          { text: feedback, pause: 300, style: "positive" },
          { text: `Ini huruf ${target.pronunciation}.`, pause: 0, style: "letter" }
        ], { restartDelay: 80 });

        await delay(900);
        if (runtime.viewToken !== token || runtime.currentView !== "guess") return;
        if (game.index >= 9) {
          game.finished = true;
          completeGame();
          createCelebration(30);
          renderApp();
          runtime.isTransitioning = false;
          return;
        }

        game.index += 1;
        runtime.isTransitioning = false;
        renderApp();
        await delay(500);
        if (runtime.viewToken !== token || runtime.currentView !== "guess") return;
        scheduleAudio(guessQuestionAudio(), 0, token);
      } else {
        runtime.isTransitioning = true;
        q.attempts += 1;
        if (button) button.classList.add("wrong");
        stopAudio();
        await delay(250);
        if (runtime.viewToken !== token || runtime.currentView !== "guess") return;
        const target = getLetter(q.target);
        const text = q.attempts >= 2
          ? `Coba cari huruf ${target.pronunciation}.`
          : randomItem(["Hampir. Coba lagi, ya.", "Belum tepat. Coba sekali lagi.", "Ayo, coba lagi."]);
        await audioManager.playSequence([{ text, pause: 0, style: "instruction" }], { restartDelay: 60 });
        await delay(450);
        if (runtime.viewToken !== token || runtime.currentView !== "guess") return;
        runtime.isTransitioning = false;
        if (button) button.classList.remove("wrong");
      }
    }

    // ============================================================
    // GAME 2: FIND LETTER
    // ============================================================
    function makeFindRound(targetLetter = null) {
      const target = targetLetter || randomItem(LETTERS).letter;
      const targetCount = 4 + Math.floor(Math.random() * 3);
      const nonTargets = Array.from({ length: 16 - targetCount }, () => randomItem(randomLetters(1, [target])));
      const cells = shuffleArray([
        ...Array.from({ length: targetCount }, () => target),
        ...nonTargets
      ]).map((letter, index) => ({ id: `${Date.now()}-${index}-${Math.random()}`, letter, found: false }));
      return { target, targetCount, foundCount: 0, cells, wrongTaps: 0 };
    }

    function startFindGame() {
      runtime.find = {
        roundIndex: 0,
        totalRounds: 5,
        round: makeFindRound(),
        score: 0,
        rewardStars: 0,
        finished: false
      };
      navigateTo("find");
    }

    function findQuestionAudio() {
      const game = runtime.find;
      if (!game || game.finished) return [];
      const item = getLetter(game.round.target);
      return [
        { text: `Yuk, cari semua huruf ${item.pronunciation}.`, pause: 500, style: "instruction" },
        { text: `Ketuk huruf ${item.pronunciation} yang kamu temukan.`, pause: 0, style: "instruction" }
      ];
    }

    function renderFindGame() {
      const game = runtime.find;
      if (!game) return renderMissingGame("Cari Huruf", "start-find");
      if (game.finished) return renderGameResult("find", game.score, null, game.rewardStars);
      const round = game.round;
      const item = getLetter(round.target);
      return `
        <section class="page">
          <div class="top-row">
            <button class="back-btn" data-action="nav" data-view="games" aria-label="Kembali ke menu game">←</button>
            <strong>🔎 Cari Huruf</strong>
            <button class="speaker" data-action="find-speak" aria-label="Dengarkan instruksi" aria-pressed="false">🔊</button>
          </div>
          ${renderGameProgress(game.roundIndex + 1, game.totalRounds)}
          <div class="card question-card mint">
            <div class="question-kicker">Cari hurufnya!</div>
            <div class="question-text">Cari semua huruf ${item.letter}</div>
            <div style="font-weight:950;font-size:18px" id="find-count">${round.foundCount} / ${round.targetCount}</div>
          </div>
          <div class="find-grid" aria-label="Papan cari huruf">
            ${round.cells.map((cell, index) => `
              <button class="find-cell ${cell.found ? "found" : ""}" data-action="find-tap" data-index="${index}" ${cell.found ? "disabled" : ""} aria-label="Huruf ${getLetter(cell.letter).pronunciation}">${cell.found ? "✓" : cell.letter}</button>
            `).join("")}
          </div>
        </section>
      `;
    }

    async function handleFindTap(index, button) {
      const game = runtime.find;
      if (!game || game.finished || runtime.isTransitioning) return;
      const round = game.round;
      const cell = round.cells[index];
      if (!cell || cell.found) return;
      const token = runtime.viewToken;

      if (cell.letter === round.target) {
        cell.found = true;
        round.foundCount += 1;
        game.score += 1;
        game.rewardStars += 1;
        addStars(1);
        addCorrect(1);
        updateBadges();
        if (button) {
          button.classList.add("found");
          button.textContent = "✓";
          button.disabled = true;
        }
        const counter = document.getElementById("find-count");
        if (counter) counter.textContent = `${round.foundCount} / ${round.targetCount}`;
        createCelebration(5);

        if (round.foundCount < round.targetCount && round.foundCount % 2 === 1 && !audioManager.isSpeaking) {
          audioManager.playSequence([{ text: randomItem(["Ketemu!", "Bagus!", "Keren!"]), pause: 0, style: "positive" }], { restartDelay: 40 });
        }

        if (round.foundCount >= round.targetCount) {
          runtime.isTransitioning = true;
          stopAudio();
          await delay(300);
          if (runtime.viewToken !== token || runtime.currentView !== "find") return;
          const item = getLetter(round.target);
          await audioManager.playSequence([
            { text: "Yeay!", pause: 300, style: "positive" },
            { text: `Semua huruf ${item.pronunciation} sudah ditemukan.`, pause: 300, style: "instruction" },
            { text: "Hebat!", pause: 0, style: "positive" }
          ], { restartDelay: 70 });
          await delay(700);
          if (runtime.viewToken !== token || runtime.currentView !== "find") return;

          if (game.roundIndex >= game.totalRounds - 1) {
            game.finished = true;
            completeGame();
            createCelebration(30);
            runtime.isTransitioning = false;
            renderApp();
          } else {
            const previousTarget = round.target;
            game.roundIndex += 1;
            let nextTarget = randomItem(LETTERS).letter;
            while (nextTarget === previousTarget) nextTarget = randomItem(LETTERS).letter;
            game.round = makeFindRound(nextTarget);
            runtime.isTransitioning = false;
            renderApp();
            scheduleAudio(findQuestionAudio(), 600, token);
          }
        }
      } else {
        round.wrongTaps += 1;
        if (button) {
          button.classList.add("wrong");
          setTimeout(() => button.classList.remove("wrong"), 420);
        }
        if (round.wrongTaps % 3 === 0) {
          const item = getLetter(round.target);
          audioManager.playSequence([{ text: `Cari huruf ${item.pronunciation}, ya.`, pause: 0, style: "instruction" }], { restartDelay: 60 });
        }
      }
    }

    // ============================================================
    // GAME 3: MATCH LETTER
    // ============================================================
    function startMatchGame() {
      const pairs = shuffleArray(LETTERS).slice(0, 5).map(x => x.letter);
      runtime.match = {
        pairs,
        upperOrder: shuffleArray(pairs),
        lowerOrder: shuffleArray(pairs),
        matched: [],
        selectedUpper: null,
        selectedLower: null,
        score: 0,
        rewardStars: 0,
        finished: false
      };
      navigateTo("match");
    }

    function matchIntroAudio() {
      return [
        { text: "Pasangkan huruf besar dengan huruf kecil.", pause: 500, style: "instruction" },
        { text: "Pilih dua huruf yang sama.", pause: 0, style: "instruction" }
      ];
    }

    function renderMatchGame() {
      const game = runtime.match;
      if (!game) return renderMissingGame("Pasangkan Huruf", "start-match");
      if (game.finished) return renderGameResult("match", game.score, 5, game.rewardStars);
      return `
        <section class="page">
          <div class="top-row">
            <button class="back-btn" data-action="nav" data-view="games" aria-label="Kembali ke menu game">←</button>
            <strong>🧩 Pasangkan Huruf</strong>
            <button class="speaker" data-action="match-speak" aria-label="Dengarkan instruksi" aria-pressed="false">🔊</button>
          </div>
          ${renderGameProgress(game.matched.length, 5, "Cocok")}
          <div class="card question-card yellow">
            <div class="question-text" style="font-size:24px">Huruf besar ↔ huruf kecil</div>
            <div class="subtle">Pilih dua huruf yang sama.</div>
          </div>
          <div class="match-columns">
            <div class="match-col" aria-label="Huruf besar">
              ${game.upperOrder.map(letter => matchButton(letter, "upper", game)).join("")}
            </div>
            <div class="match-col" aria-label="Huruf kecil">
              ${game.lowerOrder.map(letter => matchButton(letter, "lower", game)).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function matchButton(letter, side, game) {
      const matched = game.matched.includes(letter);
      const selected = side === "upper" ? game.selectedUpper === letter : game.selectedLower === letter;
      const text = side === "upper" ? letter : getLetter(letter).lowercase;
      return `<button class="match-btn ${matched ? "matched" : ""} ${selected ? "selected" : ""}" data-action="match-select" data-side="${side}" data-letter="${letter}" ${matched ? "disabled" : ""} aria-label="${side === "upper" ? "Huruf besar" : "Huruf kecil"} ${getLetter(letter).pronunciation}">${matched ? "✓" : text}</button>`;
    }

    async function handleMatchSelect(side, letter) {
      const game = runtime.match;
      if (!game || game.finished || runtime.isTransitioning || game.matched.includes(letter)) return;
      const token = runtime.viewToken;
      if (side === "upper") game.selectedUpper = game.selectedUpper === letter ? null : letter;
      if (side === "lower") game.selectedLower = game.selectedLower === letter ? null : letter;
      renderApp();

      if (!game.selectedUpper || !game.selectedLower) return;
      runtime.isTransitioning = true;
      const same = game.selectedUpper === game.selectedLower;
      const upper = game.selectedUpper;
      const lower = game.selectedLower;
      stopAudio();

      if (same) {
        game.matched.push(upper);
        game.score += 1;
        game.rewardStars += 1;
        addStars(1);
        addCorrect(1);
        updateBadges();
        createCelebration(8);
        game.selectedUpper = null;
        game.selectedLower = null;
        renderApp();
        await delay(250);
        if (runtime.viewToken !== token || runtime.currentView !== "match") return;
        const item = getLetter(upper);
        const items = game.matched.length % 2 === 0
          ? [
              { text: "Cocok!", pause: 250, style: "positive" },
              { text: `${item.pronunciation} besar, dan ${item.pronunciation} kecil.`, pause: 0, style: "letter" }
            ]
          : [{ text: randomItem(["Cocok!", "Benar!"]), pause: 0, style: "positive" }];
        await audioManager.playSequence(items, { restartDelay: 60 });
        await delay(550);
        if (runtime.viewToken !== token || runtime.currentView !== "match") return;
        if (game.matched.length >= 5) {
          game.finished = true;
          completeGame();
          createCelebration(30);
          runtime.isTransitioning = false;
          renderApp();
        } else {
          runtime.isTransitioning = false;
        }
      } else {
        document.querySelectorAll(`[data-action="match-select"][data-letter="${upper}"], [data-action="match-select"][data-letter="${lower}"]`).forEach(el => el.classList.add("wrong"));
        await delay(180);
        if (runtime.viewToken !== token || runtime.currentView !== "match") return;
        await audioManager.playSequence([{ text: "Hampir. Coba lagi.", pause: 0, style: "instruction" }], { restartDelay: 50 });
        await delay(430);
        if (runtime.viewToken !== token || runtime.currentView !== "match") return;
        game.selectedUpper = null;
        game.selectedLower = null;
        runtime.isTransitioning = false;
        renderApp();
      }
    }

    // ============================================================
    // GAME 4: FIRST LETTER
    // ============================================================
    function buildFirstQuestions() {
      return shuffleArray(LETTERS).slice(0, 10).map(item => ({
        target: item.letter,
        options: shuffleArray([item.letter, ...randomLetters(2, [item.letter])]),
        attempts: 0
      }));
    }

    function startFirstLetterGame() {
      runtime.first = {
        index: 0,
        score: 0,
        questions: buildFirstQuestions(),
        finished: false,
        rewardStars: 0
      };
      navigateTo("first");
    }

    function firstQuestionAudio() {
      const game = runtime.first;
      if (!game || game.finished) return [];
      const q = game.questions[game.index];
      const item = getLetter(q.target);
      return [
        { text: `Ini ${item.word}.`, pause: 500, style: "instruction" },
        { text: `${item.word}...`, pause: 300, style: "instruction" },
        { text: "dimulai dengan huruf apa?", pause: 0, style: "instruction" }
      ];
    }

    function renderFirstLetterGame() {
      const game = runtime.first;
      if (!game) return renderMissingGame("Huruf Awal", "start-first");
      if (game.finished) return renderGameResult("first", game.score, 10, game.rewardStars);
      const q = game.questions[game.index];
      const item = getLetter(q.target);
      return `
        <section class="page">
          <div class="top-row">
            <button class="back-btn" data-action="nav" data-view="games" aria-label="Kembali ke menu game">←</button>
            <strong>🎯 Huruf Awal</strong>
            <button class="speaker" data-action="first-speak" aria-label="Dengarkan soal" aria-pressed="false">🔊</button>
          </div>
          ${renderGameProgress(game.index + 1, 10)}
          <div class="card question-card peach">
            <div class="question-emoji" aria-hidden="true">${item.emoji}</div>
            <div class="question-word">${item.word.toUpperCase()}</div>
            <div class="question-text" style="font-size:23px">${item.word} dimulai dengan huruf apa?</div>
          </div>
          <div class="answer-grid three">
            ${q.options.map(letter => `<button class="answer-btn" data-action="first-answer" data-letter="${letter}" aria-label="Huruf ${getLetter(letter).pronunciation}">${letter}</button>`).join("")}
          </div>
        </section>
      `;
    }

    async function handleFirstAnswer(letter, button) {
      const game = runtime.first;
      if (!game || game.finished || runtime.isTransitioning) return;
      const q = game.questions[game.index];
      if (!q) return;
      const token = runtime.viewToken;
      const item = getLetter(q.target);

      if (letter === q.target) {
        runtime.isTransitioning = true;
        document.querySelectorAll(".answer-btn").forEach(b => b.disabled = true);
        if (button) button.classList.add("correct");
        game.score += 1;
        game.rewardStars += 1;
        addStars(1);
        addCorrect(1);
        updateBadges();
        createCelebration(12);
        stopAudio();
        await delay(300);
        if (runtime.viewToken !== token || runtime.currentView !== "first") return;
        await audioManager.playSequence([
          { text: "Benar!", pause: 350, style: "positive" },
          { text: `${item.word} dimulai dengan huruf ${item.pronunciation}.`, pause: 0, style: "letter" }
        ], { restartDelay: 70 });
        await delay(900);
        if (runtime.viewToken !== token || runtime.currentView !== "first") return;

        if (game.index >= 9) {
          game.finished = true;
          completeGame();
          createCelebration(30);
          runtime.isTransitioning = false;
          renderApp();
        } else {
          game.index += 1;
          runtime.isTransitioning = false;
          renderApp();
          scheduleAudio(firstQuestionAudio(), 520, token);
        }
      } else {
        runtime.isTransitioning = true;
        q.attempts += 1;
        if (button) button.classList.add("wrong");
        stopAudio();
        await delay(250);
        if (runtime.viewToken !== token || runtime.currentView !== "first") return;
        const text = q.attempts >= 2
          ? `${item.word} dimulai dengan huruf apa? Coba lagi.`
          : "Hampir. Coba lagi, ya.";
        await audioManager.playSequence([{ text, pause: 0, style: "instruction" }], { restartDelay: 55 });
        await delay(420);
        if (runtime.viewToken !== token || runtime.currentView !== "first") return;
        runtime.isTransitioning = false;
        if (button) button.classList.remove("wrong");
      }
    }

    // ============================================================
    // RESULTS
    // ============================================================
    function resultMessage(score, total) {
      if (!Number.isFinite(total)) return "Hebat! Kamu menemukan banyak huruf.";
      if (score === total) return "Luar biasa!";
      const ratio = score / total;
      if (ratio >= .7) return "Hebat!";
      if (ratio >= .4) return "Bagus! Ayo latihan lagi.";
      return "Ayo belajar lagi bersama Pipit!";
    }

    function renderGameResult(type, score, total, rewardStars) {
      const meta = {
        guess: { title: "Tebak Huruf", action: "start-guess" },
        find: { title: "Cari Huruf", action: "start-find" },
        match: { title: "Pasangkan Huruf", action: "start-match" },
        first: { title: "Huruf Awal", action: "start-first" }
      }[type] || { title: "Game", action: "nav" };
      const scoreText = Number.isFinite(total) ? `${score} / ${total}` : `${score} ditemukan`;
      return `
        <section class="page result-wrap">
          <div class="card yellow">
            <div class="result-emoji">🎉</div>
            <h1 class="page-title" style="margin-top:8px">HEBAT!</h1>
            <div class="subtle">Yeay! Permainan selesai!</div>
            <div class="result-score">${scoreText}</div>
            <p style="margin:8px 0 14px;font-weight:900">${resultMessage(score, total)}</p>
            <div>
              <span class="reward-pill">⭐ +${safeInt(rewardStars)}</span>
              <span class="reward-pill">💎 +1</span>
            </div>
          </div>
          <button class="primary-btn" data-action="${meta.action}">MAIN LAGI</button>
          <button class="secondary-btn" style="margin-top:10px" data-action="nav" data-view="home">KEMBALI KE HOME</button>
        </section>
      `;
    }

    function renderMissingGame(title, action) {
      return `
        <section class="page">
          <div class="card yellow" style="text-align:center;margin-top:32px">
            <div style="font-size:48px">🎮</div>
            <h1 class="page-title">${title}</h1>
            <p class="subtle">Ayo mulai permainannya.</p>
            <button class="primary-btn" data-action="${action}">MULAI</button>
          </div>
        </section>
      `;
    }

    function renderGameProgress(current, total, label = "Soal") {
      const pct = clamp((current / total) * 100, 0, 100);
      return `<div class="game-progress"><span>${label} ${current} / ${total}</span><div class="mini-progress"><span style="width:${pct}%"></span></div></div>`;
    }

    // ============================================================
    // REWARDS
    // ============================================================
    function renderRewards() {
      return `
        <section class="page">
          <div class="top-row">
            <div>
              <h1 class="page-title">🏆 Hadiahku</h1>
              <div class="subtle">Lihat bintang, berlian, dan badge-mu.</div>
            </div>
            <div class="mascot small" aria-hidden="true">🐦</div>
          </div>

          <div class="stats-row">
            <div class="stat-chip"><strong>⭐ ${state.stars}</strong><span>TOTAL BINTANG</span></div>
            <div class="stat-chip"><strong>💎 ${state.diamonds}</strong><span>BERLIAN</span></div>
            <div class="stat-chip"><strong>🔥 ${state.streak}</strong><span>STREAK</span></div>
          </div>

          <div class="section-title"><h2>Badge Saya</h2><span class="subtle">${state.badges.length} / ${BADGES.length}</span></div>
          <div class="badge-grid">
            ${BADGES.map(badge => {
              const unlocked = state.badges.includes(badge.id);
              return `<div class="badge-card ${unlocked ? "" : "locked"}">
                <div class="badge-icon">${unlocked ? badge.icon : "🔒"}</div>
                <strong>${escapeHtml(badge.name)}</strong>
                <small>${escapeHtml(badge.desc)}</small>
              </div>`;
            }).join("")}
          </div>
        </section>
      `;
    }

    // ============================================================
    // PARENT MODE
    // ============================================================
    function newParentQuestion() {
      runtime.parentA = 2 + Math.floor(Math.random() * 7);
      runtime.parentB = 1 + Math.floor(Math.random() * 6);
    }

    function renderParentGate() {
      return `
        <section class="page">
          <div class="top-row">
            <button class="back-btn" data-action="nav" data-view="home" aria-label="Kembali ke Home">←</button>
            <strong>Untuk Orang Tua</strong>
            <div style="width:46px"></div>
          </div>
          <div class="card lavender">
            <div style="font-size:48px;text-align:center">👨‍👩‍👧</div>
            <h1 class="page-title" style="text-align:center;margin-top:8px">Khusus orang tua</h1>
            <p class="subtle" style="text-align:center">Jawab dulu pertanyaan sederhana ini, ya.</p>
            <div class="parent-question">${runtime.parentA} + ${runtime.parentB} = ?</div>
            <input id="parent-answer" class="number-input" type="number" inputmode="numeric" autocomplete="off" aria-label="Jawaban hitungan" />
            <button class="primary-btn" data-action="check-parent">MASUK</button>
          </div>
        </section>
      `;
    }

    function renderParentDashboard() {
      const learned = [...state.learnedLetters].sort((a, b) => getLetterIndex(a) - getLetterIndex(b));
      const notLearned = LETTERS.map(x => x.letter).filter(x => !learned.includes(x));
      const pct = Math.round((learned.length / 26) * 100);
      return `
        <section class="page">
          <div class="top-row">
            <button class="back-btn" data-action="nav" data-view="home" aria-label="Kembali ke Home">←</button>
            <strong>Perkembangan Belajar</strong>
            <div style="width:46px"></div>
          </div>

          <div class="card sky">
            <div class="progress-head"><strong>Huruf Dipelajari</strong><span>${learned.length} / 26</span></div>
            <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
          </div>

          <div class="stats-row">
            <div class="stat-chip"><strong>⭐ ${state.stars}</strong><span>BINTANG</span></div>
            <div class="stat-chip"><strong>💎 ${state.diamonds}</strong><span>BERLIAN</span></div>
            <div class="stat-chip"><strong>🔥 ${state.streak}</strong><span>${state.streak === 1 ? "HARI" : "HARI"}</span></div>
          </div>

          <div class="card mint">
            <div class="progress-head"><strong>Game dimainkan</strong><span>${state.gamesPlayed}</span></div>
            <div class="progress-head" style="margin-bottom:0"><strong>Jawaban benar</strong><span>${state.correctAnswers}</span></div>
          </div>

          <div class="card">
            <strong>Huruf Sudah Dipelajari</strong>
            ${learned.length ? `<div class="letter-list">${learned.map(l => `<span class="letter-pill">${l}</span>`).join("")}</div>` : `<p class="subtle">Belum ada huruf yang dipelajari.</p>`}
          </div>

          <div class="card">
            <strong>Huruf Belum Dipelajari</strong>
            ${notLearned.length ? `<div class="letter-list">${notLearned.map(l => `<span class="letter-pill" style="background:var(--lavender)">${l}</span>`).join("")}</div>` : `<p class="subtle">Semua huruf sudah dipelajari. Hebat!</p>`}
          </div>

          <button class="danger-btn" data-action="confirm-reset">RESET PERKEMBANGAN</button>

          <div class="footer-note">
            <strong>Pipit Huruf</strong><br>
            by PipitPintar<br>
            “Media Edukasi Anak untuk PAUD, TK &amp; SD”
          </div>
        </section>
      `;
    }

    function showResetModal() {
      showModal(`
        <div class="big">⚠️</div>
        <h2>Reset perkembangan?</h2>
        <p>Yakin ingin menghapus semua perkembangan belajar?</p>
        <div class="btn-row">
          <button class="secondary-btn" data-action="close-modal">BATAL</button>
          <button class="danger-btn" data-action="do-reset">RESET</button>
        </div>
      `);
    }

    function resetProgress() {
      Object.values(STORAGE).forEach(key => {
        if (key !== STORAGE.onboarding) safeRemove(key);
      });
      state = defaultState();
      updateStreak();
      runtime.guess = null;
      runtime.find = null;
      runtime.match = null;
      runtime.first = null;
      runtime.badgeQueue = [];
      closeModal();
      navigateTo("parent");
      showToast("Perkembangan sudah direset.");
    }

    // ============================================================
    // EVENT HANDLING — single delegated listener
    // ============================================================
    document.addEventListener("click", async event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = button.dataset.action;

      if (action === "nav") {
        navigateTo(button.dataset.view || "home");
        return;
      }

      if (action === "onboarding-next") {
        if (runtime.onboardingSlide < 2) {
          runtime.onboardingSlide += 1;
          renderApp();
        } else {
          safeSet(STORAGE.onboarding, "1");
          navigateTo("home");
        }
        return;
      }

      if (action === "home-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        speakSequence([
          { text: "Halo! Aku Pipit.", pause: 500, style: "instruction" },
          { text: "Ayo belajar huruf sambil bermain!", pause: 0, style: "instruction" }
        ]);
        return;
      }

      if (action === "open-letter") {
        openLetter(Number(button.dataset.index));
        return;
      }
      if (action === "prev-letter") {
        if (runtime.letterIndex > 0) openLetter(runtime.letterIndex - 1);
        return;
      }
      if (action === "next-letter") {
        if (runtime.letterIndex < 25) openLetter(runtime.letterIndex + 1);
        return;
      }
      if (action === "detail-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        speakSequence(detailAudioItems(LETTERS[runtime.letterIndex]));
        return;
      }
      if (action === "case-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        const item = LETTERS[runtime.letterIndex];
        speakSequence([
          { text: `Ini ${item.pronunciation} besar.`, pause: 500, style: "letter" },
          { text: `Ini ${item.pronunciation} kecil.`, pause: 500, style: "letter" },
          { text: `Keduanya adalah huruf ${item.pronunciation}.`, pause: 0, style: "letter" }
        ]);
        return;
      }

      if (action === "start-guess") return startGuessGame();
      if (action === "guess-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        return speakSequence(guessQuestionAudio());
      }
      if (action === "guess-answer") return handleGuessAnswer(button.dataset.letter, button);

      if (action === "start-find") return startFindGame();
      if (action === "find-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        return speakSequence(findQuestionAudio());
      }
      if (action === "find-tap") return handleFindTap(Number(button.dataset.index), button);

      if (action === "start-match") return startMatchGame();
      if (action === "match-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        return speakSequence(matchIntroAudio());
      }
      if (action === "match-select") return handleMatchSelect(button.dataset.side, button.dataset.letter);

      if (action === "start-first") return startFirstLetterGame();
      if (action === "first-speak") {
        if (!audioManager.supported) return showToast("Suara belum didukung di browser ini.");
        return speakSequence(firstQuestionAudio());
      }
      if (action === "first-answer") return handleFirstAnswer(button.dataset.letter, button);

      if (action === "open-parent") {
        newParentQuestion();
        navigateTo("parentGate");
        setTimeout(() => document.getElementById("parent-answer")?.focus(), 180);
        return;
      }
      if (action === "check-parent") {
        const input = document.getElementById("parent-answer");
        const answer = Number(input?.value);
        if (answer === runtime.parentA + runtime.parentB) {
          navigateTo("parent");
        } else {
          if (input) {
            input.value = "";
            input.classList.add("wrong");
            setTimeout(() => input.classList.remove("wrong"), 400);
            input.focus();
          }
          showToast("Coba hitung lagi, ya.");
        }
        return;
      }
      if (action === "confirm-reset") return showResetModal();
      if (action === "close-modal") return closeModal();
      if (action === "do-reset") return resetProgress();
      if (action === "close-badge") {
        closeModal();
        setTimeout(showNextBadgeModal, 120);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && runtime.currentView === "parentGate") {
        const btn = document.querySelector('button[data-action="check-parent"]');
        if (btn) btn.click();
      }
    });

    window.addEventListener("pagehide", () => stopAudio());
    window.addEventListener("beforeunload", () => stopAudio());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopAudio();
    });

    // ============================================================
    // INITIALIZE
    // ============================================================
    function initializeApp() {
      loadState();
      updateStreak();
      updateBadges();
      runtime.currentView = "splash";
      runtime.viewToken += 1;
      renderApp();

      const splashToken = runtime.viewToken;
      setTimeout(() => {
        if (runtime.viewToken !== splashToken || runtime.currentView !== "splash") return;
        const onboarded = safeGet(STORAGE.onboarding, "0") === "1";
        navigateTo(onboarded ? "home" : "onboarding");
      }, 1250);
    }

    initializeApp();
  </script>
</body>
</html>
