<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eefaff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Pipit Huruf — Main, Dengar, Kenal, dan Ingat Huruf!</title>
  <style>
    :root {
      --sky: #dff5ff;
      --sky-2: #bfe8ff;
      --blue: #68bff3;
      --blue-deep: #2f8fc9;
      --mint: #dff8e9;
      --mint-strong: #73d7a4;
      --yellow: #fff3b8;
      --yellow-strong: #f4c95d;
      --peach: #ffe2d5;
      --peach-strong: #ff9e78;
      --lavender: #eee5ff;
      --lavender-strong: #a88ce8;
      --white: #ffffff;
      --ink: #26364a;
      --muted: #6f7f91;
      --success: #57c98a;
      --danger-soft: #ffdeda;
      --danger: #e56b63;
      --shadow: 0 14px 38px rgba(67, 108, 138, 0.13);
      --shadow-soft: 0 8px 22px rgba(67, 108, 138, 0.10);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --nav-h: 76px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 12% 4%, rgba(255,255,255,.95), transparent 28%),
        linear-gradient(180deg, #f4fcff 0%, #fffdf8 55%, #f8f5ff 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Arial Rounded MT Bold", "Arial Rounded MT", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
      touch-action: manipulation;
    }

    button:focus-visible, input:focus-visible {
      outline: 4px solid rgba(47, 143, 201, .25);
      outline-offset: 2px;
    }

    button:disabled { cursor: default; }

    #app {
      width: 100%;
      min-height: 100dvh;
    }

    .app-shell {
      width: min(100%, 560px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 18px 16px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom));
      position: relative;
    }

    .app-shell.no-nav { padding-bottom: 28px; }

    .page {
      animation: fadeIn .32s ease both;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .back-btn, .icon-btn, .mini-btn {
      min-width: 46px;
      min-height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,.85);
      box-shadow: var(--shadow-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .back-btn:active, .icon-btn:active, .mini-btn:active,
    .primary-btn:active, .secondary-btn:active, .game-card:active,
    .letter-card:active, .answer-btn:active, .nav-btn:active {
      transform: scale(.96);
    }

    .page-title {
      margin: 0;
      font-size: clamp(24px, 7vw, 32px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.4px;
    }

    .subtle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .mascot {
      width: 94px;
      height: 94px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: 54px;
      background: linear-gradient(145deg, #ffffff, #e7f8ff);
      box-shadow: var(--shadow);
      position: relative;
      flex: 0 0 auto;
      animation: floaty 3.1s ease-in-out infinite;
    }

    .mascot.small {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      font-size: 39px;
    }

    .mascot::after {
      content: "";
      width: 22px;
      height: 8px;
      border-radius: 99px;
      background: rgba(38,54,74,.08);
      position: absolute;
      bottom: -10px;
      filter: blur(2px);
    }

    .hero {
      background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(223,245,255,.88));
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
      overflow: hidden;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,243,184,.55);
      right: -52px;
      top: -58px;
    }

    .hero-copy { position: relative; z-index: 1; flex: 1; }
    .hero h1 { margin: 0 0 6px; font-size: clamp(26px, 7vw, 36px); line-height: 1.05; }
    .hero p { margin: 0; color: var(--muted); line-height: 1.45; font-size: 15px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: 12px 0 14px;
    }

    .stat-chip {
      min-height: 64px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--shadow-soft);
      border-radius: 20px;
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
    }

    .stat-chip strong { font-size: 19px; }
    .stat-chip span { font-size: 11px; color: var(--muted); font-weight: 800; }

    .card {
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 14px;
    }

    .card.mint { background: linear-gradient(145deg, #ffffff, var(--mint)); }
    .card.yellow { background: linear-gradient(145deg, #ffffff, var(--yellow)); }
    .card.peach { background: linear-gradient(145deg, #ffffff, var(--peach)); }
    .card.lavender { background: linear-gradient(145deg, #ffffff, var(--lavender)); }
    .card.sky { background: linear-gradient(145deg, #ffffff, var(--sky)); }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-head strong { font-size: 16px; }
    .progress-head span { font-weight: 900; color: var(--blue-deep); }

    .progress-track {
      height: 12px;
      background: rgba(74, 114, 145, .10);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--mint-strong));
      transition: width .45s ease;
    }

    .primary-btn, .secondary-btn, .danger-btn {
      width: 100%;
      min-height: 54px;
      border-radius: 19px;
      padding: 12px 18px;
      font-weight: 900;
      font-size: 15px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      transition: transform .16s ease, filter .16s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, #6bc8f5, #66d4a2);
      color: #17384b;
      box-shadow: 0 12px 24px rgba(80, 183, 193, .22);
    }

    .secondary-btn {
      background: rgba(255,255,255,.9);
      box-shadow: var(--shadow-soft);
    }

    .danger-btn {
      background: var(--danger-soft);
      color: #8b3732;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .section-title {
      margin: 20px 2px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
    }

    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .game-card {
      min-height: 126px;
      text-align: left;
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      transition: transform .16s ease;
    }

    .game-card .emoji { font-size: 33px; display: block; margin-bottom: 14px; }
    .game-card strong { display: block; font-size: 15px; line-height: 1.2; }
    .game-card small { color: var(--muted); display: block; margin-top: 5px; line-height: 1.3; }
    .game-card.c1 { background: linear-gradient(145deg, #e8f8ff, #cfefff); }
    .game-card.c2 { background: linear-gradient(145deg, #ecfff4, #d7f6e4); }
    .game-card.c3 { background: linear-gradient(145deg, #fff9d9, #fff0ad); }
    .game-card.c4 { background: linear-gradient(145deg, #f4edff, #e7dbff); }

    .letter-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .letter-card {
      min-height: 66px;
      border-radius: 20px;
      background: rgba(255,255,255,.93);
      box-shadow: var(--shadow-soft);
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 900;
      position: relative;
      transition: transform .16s ease;
    }

    .letter-card:nth-child(5n+1) { background: var(--sky); }
    .letter-card:nth-child(5n+2) { background: var(--mint); }
    .letter-card:nth-child(5n+3) { background: var(--yellow); }
    .letter-card:nth-child(5n+4) { background: var(--peach); }
    .letter-card:nth-child(5n+5) { background: var(--lavender); }

    .learned-mark {
      position: absolute;
      right: 6px;
      top: 5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--success);
      color: #fff;
      font-size: 11px;
      display: grid;
      place-items: center;
      box-shadow: 0 5px 12px rgba(87,201,138,.25);
    }

    .detail-card {
      text-align: center;
      padding: 24px 18px;
      overflow: hidden;
      position: relative;
    }

    .detail-letters {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: stretch;
      margin: 8px auto 18px;
    }

    .letter-box {
      width: min(42vw, 150px);
      min-height: 152px;
      border-radius: 28px;
      background: linear-gradient(150deg, #ffffff, var(--sky));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .letter-box.lower { background: linear-gradient(150deg, #ffffff, var(--lavender)); }
    .letter-big { font-size: clamp(72px, 22vw, 104px); font-weight: 950; line-height: .95; }
    .letter-label { font-size: 10px; margin-top: 10px; color: var(--muted); font-weight: 900; letter-spacing: .5px; }

    .word-emoji { font-size: 72px; margin: 8px 0 4px; animation: bounceSoft 2.4s ease-in-out infinite; }
    .word-line { font-size: 25px; font-weight: 950; margin: 4px 0 18px; }

    .speaker {
      min-width: 54px;
      min-height: 54px;
      border-radius: 19px;
      background: linear-gradient(145deg, #fff, #e9f8ff);
      box-shadow: var(--shadow-soft);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      font-weight: 900;
    }

    .speaker.speaking { animation: pulse 1s ease-in-out infinite; }

    .question-card {
      text-align: center;
      padding: 22px 18px;
    }

    .question-kicker {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 950;
      color: var(--blue-deep);
      letter-spacing: .7px;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: clamp(23px, 7vw, 32px);
      line-height: 1.18;
      font-weight: 950;
      margin: 6px 0 16px;
    }

    .question-emoji { font-size: 76px; margin: 8px 0 2px; }
    .question-word { font-size: 28px; font-weight: 950; letter-spacing: 1px; margin-bottom: 10px; }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-top: 14px;
    }

    .answer-grid.three { grid-template-columns: repeat(3, 1fr); }

    .answer-btn {
      min-height: 86px;
      border-radius: 24px;
      background: rgba(255,255,255,.93);
      box-shadow: var(--shadow-soft);
      font-size: clamp(32px, 10vw, 46px);
      font-weight: 950;
      transition: transform .16s ease, background .18s ease;
    }

    .answer-btn.correct {
      background: #d9f8e6;
      animation: bounce .5s ease;
    }

    .answer-btn.wrong { animation: shake .38s ease; background: #fff1ee; }

    .game-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 11px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .mini-progress {
      flex: 1;
      height: 8px;
      margin-left: 12px;
      background: rgba(63,97,124,.10);
      border-radius: 999px;
      overflow: hidden;
    }
    .mini-progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--mint-strong)); }

    .find-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-top: 14px;
    }

    .find-cell {
      min-height: 68px;
      border-radius: 19px;
      background: rgba(255,255,255,.94);
      box-shadow: var(--shadow-soft);
      font-size: 28px;
      font-weight: 950;
    }

    .find-cell.found {
      background: #dff8e9;
      color: #1f8553;
      transform: scale(.94);
    }

    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 12px;
    }

    .match-col { display: grid; gap: 10px; }

    .match-btn {
      min-height: 66px;
      border-radius: 20px;
      background: rgba(255,255,255,.93);
      box-shadow: var(--shadow-soft);
      font-size: 29px;
      font-weight: 950;
      transition: transform .16s ease, background .16s ease;
    }

    .match-btn.selected { background: var(--yellow); transform: translateY(-2px); }
    .match-btn.matched { background: var(--mint); color: #258453; opacity: .72; }
    .match-btn.wrong { animation: shake .38s ease; background: #fff1ee; }

    .result-wrap {
      text-align: center;
      padding-top: 16px;
    }

    .result-emoji { font-size: 80px; animation: bounce 1s ease both; }
    .result-score { font-size: 44px; font-weight: 950; margin: 6px 0; }
    .reward-pill {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      border-radius: 999px;
      padding: 9px 14px;
      margin: 5px;
      font-weight: 900;
      background: rgba(255,255,255,.9);
      box-shadow: var(--shadow-soft);
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .badge-card {
      min-height: 130px;
      border-radius: 22px;
      padding: 15px 12px;
      text-align: center;
      background: rgba(255,255,255,.9);
      box-shadow: var(--shadow-soft);
    }

    .badge-card.locked { filter: grayscale(.75); opacity: .5; }
    .badge-icon { font-size: 35px; margin-bottom: 7px; }
    .badge-card strong { display: block; font-size: 13px; line-height: 1.25; }
    .badge-card small { color: var(--muted); display: block; margin-top: 5px; font-size: 11px; line-height: 1.35; }

    .letter-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .letter-pill {
      min-width: 36px;
      height: 36px;
      padding: 0 9px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      background: var(--sky);
    }

    .empty-box {
      padding: 20px;
      text-align: center;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff, var(--yellow));
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }
    .empty-box .emoji { font-size: 42px; }
    .empty-box h3 { margin: 7px 0 5px; }
    .empty-box p { margin: 0 0 14px; color: var(--muted); }

    .parent-question {
      font-size: 34px;
      font-weight: 950;
      text-align: center;
      margin: 12px 0 14px;
    }

    .number-input {
      width: 100%;
      min-height: 56px;
      border: 2px solid rgba(83,123,151,.12);
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 24px;
      text-align: center;
      color: var(--ink);
      background: rgba(255,255,255,.95);
      margin-bottom: 10px;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      padding: 20px 10px 4px;
      font-size: 12px;
      line-height: 1.6;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(10px + env(safe-area-inset-bottom));
      width: calc(min(100%, 560px) - 24px);
      min-height: var(--nav-h);
      padding: 8px;
      border-radius: 26px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 42px rgba(58,92,120,.20);
      border: 1px solid rgba(255,255,255,.95);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      z-index: 40;
    }

    .nav-btn {
      min-height: 58px;
      border-radius: 19px;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-size: 20px;
      transition: transform .16s ease, background .16s ease;
    }
    .nav-btn span { font-size: 10px; font-weight: 900; }
    .nav-btn.active { background: linear-gradient(145deg, var(--sky), var(--mint)); }

    .splash {
      min-height: calc(100dvh - 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 18px;
    }

    .splash .mascot { width: 132px; height: 132px; border-radius: 40px; font-size: 75px; margin: 0 auto 26px; }
    .brand-title { font-size: clamp(38px, 12vw, 58px); font-weight: 950; letter-spacing: -1.5px; margin: 0; }
    .tagline { margin: 8px auto 0; max-width: 320px; color: var(--muted); line-height: 1.5; font-weight: 700; }

    .onboarding {
      min-height: calc(100dvh - 44px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 2px 10px;
    }

    .onboard-art {
      min-height: 310px;
      border-radius: 36px;
      background: linear-gradient(145deg, #fff, var(--sky));
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      font-size: 100px;
      position: relative;
      overflow: hidden;
    }
    .onboard-art::before, .onboard-art::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: .55;
    }
    .onboard-art::before { width: 160px; height: 160px; background: var(--yellow); left: -60px; top: -50px; }
    .onboard-art::after { width: 190px; height: 190px; background: var(--lavender); right: -75px; bottom: -85px; }
    .onboard-art > span { position: relative; z-index: 1; animation: floaty 2.8s ease-in-out infinite; }

    .onboard-copy { text-align: center; padding: 24px 14px 12px; }
    .onboard-copy h1 { font-size: 29px; margin: 0 0 8px; }
    .onboard-copy p { color: var(--muted); line-height: 1.55; margin: 0 auto; max-width: 360px; }
    .dots { display: flex; justify-content: center; gap: 7px; margin: 10px 0 18px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: rgba(70,107,134,.18); }
    .dot.active { width: 22px; background: var(--blue); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(31,47,63,.34);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
      animation: fadeIn .2s ease both;
    }

    .modal {
      width: min(100%, 430px);
      max-height: min(80dvh, 620px);
      overflow: auto;
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(30,53,70,.28);
      padding: 22px;
      text-align: center;
      animation: slideUp .28s ease both;
    }

    .modal .big { font-size: 58px; margin-bottom: 8px; }
    .modal h2 { margin: 0 0 8px; font-size: 25px; }
    .modal p { color: var(--muted); line-height: 1.5; margin: 0 0 18px; }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));
      width: min(calc(100% - 34px), 420px);
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(38,54,74,.94);
      color: #fff;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      z-index: 120;
      animation: slideUp .25s ease both;
      pointer-events: none;
    }

    #celebration-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 90;
    }

    .particle {
      position: absolute;
      top: -40px;
      animation: fall linear forwards;
      will-change: transform, opacity;
      filter: drop-shadow(0 6px 5px rgba(0,0,0,.08));
    }

    .hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-top: 10px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes floaty { 0%,100%{ transform: translateY(0) rotate(-1deg); } 50%{ transform: translateY(-8px) rotate(1deg); } }
    @keyframes pulse { 0%,100%{ transform: scale(1); box-shadow: var(--shadow-soft); } 50%{ transform: scale(1.05); box-shadow: 0 10px 28px rgba(75,168,214,.28); } }
    @keyframes bounce { 0%{ transform: scale(.94); } 45%{ transform: scale(1.12); } 70%{ transform: scale(.98); } 100%{ transform: scale(1); } }
    @keyframes bounceSoft { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
    @keyframes shake { 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-7px); } 50%{ transform: translateX(7px); } 75%{ transform: translateX(-4px); } }
    @keyframes fall {
      0% { transform: translate3d(0,-20px,0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate3d(var(--drift), 110dvh, 0) rotate(var(--spin)); opacity: .1; }
    }

    @media (max-width: 350px) {
      .app-shell { padding-left: 12px; padding-right: 12px; }
      .letter-grid { gap: 7px; }
      .letter-card { min-height: 58px; border-radius: 17px; }
      .game-grid { gap: 9px; }
      .game-card { min-height: 116px; padding: 13px; }
      .detail-letters { gap: 10px; }
      .letter-box { min-height: 134px; border-radius: 23px; }
      .answer-grid { gap: 8px; }
      .answer-btn { min-height: 76px; }
    }

    @media (min-width: 700px) {
      .app-shell { padding-top: 26px; }
      .game-card { min-height: 145px; }
      .letter-card { min-height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <div id="celebration-layer" aria-hidden="true"></div>

  <script>
    "use strict";

    // ============================================================
    // DATA
    // ============================================================
    const LETTERS = [
      { letter: "A", lowercase: "a", pronunciation: "A", word: "Apel", emoji: "🍎" },
      { letter: "B", lowercase: "b", pronunciation: "Be", word: "Bola", emoji: "⚽" },
      { letter: "C", lowercase: "c", pronunciation: "Ce", word: "Cicak", emoji: "🦎" },
      { letter: "D", lowercase: "d", pronunciation: "De", word: "Domba", emoji: "🐑" },
      { letter: "E", lowercase: "e", pronunciation: "E", word: "Es", emoji: "🧊" },
      { letter: "F", lowercase: "f", pronunciation: "Ef", word: "Foto", emoji: "📷" },
      { letter: "G", lowercase: "g", pronunciation: "Ge", word: "Gajah", emoji: "🐘" },
      { letter: "H", lowercase: "h", pronunciation: "Ha", word: "Hujan", emoji: "🌧️" },
      { letter: "I", lowercase: "i", pronunciation: "I", word: "Ikan", emoji: "🐟" },
      { letter: "J", lowercase: "j", pronunciation: "Je", word: "Jeruk", emoji: "🍊" },
      { letter: "K", lowercase: "k", pronunciation: "Ka", word: "Kucing", emoji: "🐱" },
      { letter: "L", lowercase: "l", pronunciation: "El", word: "Lampu", emoji: "💡" },
      { letter: "M", lowercase: "m", pronunciation: "Em", word: "Mobil", emoji: "🚗" },
      { letter: "N", lowercase: "n", pronunciation: "En", word: "Nanas", emoji: "🍍" },
      { letter: "O", lowercase: "o", pronunciation: "O", word: "Obat", emoji: "💊" },
      { letter: "P", lowercase: "p", pronunciation: "Pe", word: "Pisang", emoji: "🍌" },
      { letter: "Q", lowercase: "q", pronunciation: "Ki", word: "Quran", emoji: "📖" },
      { letter: "R", lowercase: "r", pronunciation: "Er", word: "Rumah", emoji: "🏠" },
      { letter: "S", lowercase: "s", pronunciation: "Es", word: "Sapi", emoji: "🐄" },
      { letter: "T", lowercase: "t", pronunciation: "Te", word: "Topi", emoji: "🎩" },
      { letter: "U", lowercase: "u", pronunciation: "U", word: "Ular", emoji: "🐍" },
      { letter: "V", lowercase: "v", pronunciation: "Ve", word: "Vas", emoji: "🏺" },
      { letter: "W", lowercase: "w", pronunciation: "We", word: "Wortel", emoji: "🥕" },
      { letter: "X", lowercase: "x", pronunciation: "Eks", word: "Xilofon", emoji: "🎼" },
      { letter: "Y", lowercase: "y", pronunciation: "Ye", word: "Yoyo", emoji: "🪀" },
      { letter: "Z", lowercase: "z", pronunciation: "Zet", word: "Zebra", emoji: "🦓" }
    ];

    const BADGES = [
      { id: "start", icon: "🌱", name: "MULAI BELAJAR", desc: "Belajar 1 huruf", test: s => s.learnedLetters.length >= 1 },
      { id: "explorer", icon: "🔤", name: "PENJELAJAH HURUF", desc: "Belajar 5 huruf", test: s => s.learnedLetters.length >= 5 },
      { id: "smart", icon: "⭐", name: "JAGO HURUF", desc: "Belajar 10 huruf", test: s => s.learnedLetters.length >= 10 },
      { id: "super", icon: "🌟", name: "SUPER HURUF", desc: "Belajar 20 huruf", test: s => s.learnedLetters.length >= 20 },
      { id: "master", icon: "🏆", name: "MASTER HURUF", desc: "Belajar 26 huruf", test: s => s.learnedLetters.length >= 26 },
      { id: "guesser", icon: "🎯", name: "PENEBAK HEBAT", desc: "20 jawaban benar", test: s => s.correctAnswers >= 20 },
      { id: "gamer", icon: "🎮", name: "PEMAIN HEBAT", desc: "10 game selesai", test: s => s.gamesPlayed >= 10 }
    ];

    const STORAGE = {
      onboarding: "pipitHurufOnboarding",
      learned: "pipitHurufLearned",
      stars: "pipitHurufStars",
      diamonds: "pipitHurufDiamonds",
      streak: "pipitHurufStreak",
      lastOpen: "pipitHurufLastOpen",
      correct: "pipitHurufCorrectAnswers",
      games: "pipitHurufGamesPlayed",
      badges: "pipitHurufBadges"
    };

    const defaultState = () => ({
      stars: 0,
      diamonds: 0,
      streak: 0,
      lastOpen: "",
      learnedLetters: [],
      correctAnswers: 0,
      gamesPlayed: 0,
      badges: []
    });

    let state = defaultState();

    const runtime = {
      currentView: "splash",
      previousView: "home",
      viewToken: 0,
      onboardingSlide: 0,
      homeGreeted: false,
      letterIndex: 0,
      isTransitioning: false,
      guess: null,
      find: null,
      match: null,
      first: null,
      parentA: 4,
      parentB: 3,
      badgeQueue: [],
      toastTimer: null
    };

    // ============================================================
    // SAFE STORAGE
    // ============================================================
    function safeGet(key, fallback = null) {
      try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : value;
      } catch (_) {
        return fallback;
      }
    }

    function safeSet(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (_) {
        return false;
      }
    }

    function safeRemove(key) {
      try { localStorage.removeItem(key); } catch (_) {}
    }

    function safeParseArray(value) {
      if (!value) return [];
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function safeInt(value, fallback = 0) {
      const n = Number.parseInt(value, 10);
      return Number.isFinite(n) && n >= 0 ? n : fallback;
    }

    function loadState() {
      const validLetters = new Set(LETTERS.map(x => x.letter));
      const validBadgeIds = new Set(BADGES.map(x => x.id));

      const learned = safeParseArray(safeGet(STORAGE.learned, "[]"))
        .filter(x => validLetters.has(x));
      const badges = safeParseArray(safeGet(STORAGE.badges, "[]"))
        .filter(x => validBadgeIds.has(x));

      state = {
        stars: safeInt(safeGet(STORAGE.stars, "0")),
        diamonds: safeInt(safeGet(STORAGE.diamonds, "0")),
        streak: safeInt(safeGet(STORAGE.streak, "0")),
        lastOpen: safeGet(STORAGE.lastOpen, "") || "",
        learnedLetters: [...new Set(learned)].slice(0, 26),
        correctAnswers: safeInt(safeGet(STORAGE.correct, "0")),
        gamesPlayed: safeInt(safeGet(STORAGE.games, "0")),
        badges: [...new Set(badges)]
      };
    }

    function saveState() {
      safeSet(STORAGE.stars, String(Math.max(0, safeInt(state.stars))));
      safeSet(STORAGE.diamonds, String(Math.max(0, safeInt(state.diamonds))));
      safeSet(STORAGE.streak, String(Math.max(0, safeInt(state.streak))));
      safeSet(STORAGE.lastOpen, state.lastOpen || "");
      safeSet(STORAGE.learned, JSON.stringify([...new Set(state.learnedLetters)].slice(0, 26)));
      safeSet(STORAGE.correct, String(Math.max(0, safeInt(state.correctAnswers))));
      safeSet(STORAGE.games, String(Math.max(0, safeInt(state.gamesPlayed))));
      safeSet(STORAGE.badges, JSON.stringify([...new Set(state.badges)]));
    }

    function localDateString(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function dayDifference(fromYmd, toYmd) {
      const parse = value => {
        const [y, m, d] = String(value).split("-").map(Number);
        if (![y, m, d].every(Number.isFinite)) return null;
        return new Date(y, m - 1, d, 12, 0, 0, 0);
      };
      const a = parse(fromYmd);
      const b = parse(toYmd);
      if (!a || !b) return null;
      return Math.round((b - a) / 86400000);
    }

    function updateStreak() {
      const today = localDateString();
      if (!state.lastOpen) {
        state.streak = 1;
        state.lastOpen = today;
      } else if (state.lastOpen !== today) {
        const diff = dayDifference(state.lastOpen, today);
        state.streak = diff === 1 ? Math.max(1, state.streak + 1) : 1;
        state.lastOpen = today;
      }
      saveState();
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function randomLetters(count, exclude = []) {
      const excluded = new Set(exclude);
      return shuffleArray(LETTERS.map(x => x.letter).filter(x => !excluded.has(x))).slice(0, count);
    }

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, n));
    }

    function getLetter(letter) {
      return LETTERS.find(x => x.letter === letter) || LETTERS[0];
    }

    function getLetterIndex(letter) {
      const i = LETTERS.findIndex(x => x.letter === letter);
      return i >= 0 ? i : 0;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // ============================================================
    // AUDIO MANAGER
    // ============================================================
    const audioManager = {
      supported: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
      voices: [],
      selectedVoice: null,
      sessionId: 0,
      isSpeaking: false,
      currentDone: null,
      currentTimer: null,

      refreshVoices() {
        if (!this.supported) return;
        try {
          this.voices = window.speechSynthesis.getVoices() || [];
          this.selectedVoice = selectIndonesianVoice(this.voices);
        } catch (_) {
          this.voices = [];
          this.selectedVoice = null;
        }
      },

      stop() {
        this.sessionId += 1;
        this.isSpeaking = false;
        if (this.currentTimer) {
          clearTimeout(this.currentTimer);
          this.currentTimer = null;
        }
        const done = this.currentDone;
        this.currentDone = null;
        try {
          if (this.supported) window.speechSynthesis.cancel();
        } catch (_) {}
        if (typeof done === "function") done();
        updateSpeakerUI();
        return this.sessionId;
      },

      async speak(text, options = {}, session = this.sessionId) {
        if (!text || !this.supported || session !== this.sessionId) return;

        return new Promise(resolve => {
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            if (this.currentTimer) {
              clearTimeout(this.currentTimer);
              this.currentTimer = null;
            }
            if (this.currentDone === finish) this.currentDone = null;
            this.isSpeaking = false;
            updateSpeakerUI();
            resolve();
          };

          try {
            const utterance = new SpeechSynthesisUtterance(String(text));
            utterance.lang = "id-ID";
            if (this.selectedVoice) utterance.voice = this.selectedVoice;
            utterance.rate = Number.isFinite(options.rate) ? options.rate : 0.88;
            utterance.pitch = Number.isFinite(options.pitch) ? options.pitch : 1.05;
            utterance.volume = Number.isFinite(options.volume) ? options.volume : 1;
            utterance.onend = finish;
            utterance.onerror = finish;

            this.currentDone = finish;
            this.isSpeaking = true;
            updateSpeakerUI();

            const estimated = clamp(String(text).length * 105 + 1800, 2200, 9000);
            this.currentTimer = setTimeout(finish, estimated);

            if (session !== this.sessionId) {
              finish();
              return;
            }

            window.speechSynthesis.speak(utterance);
          } catch (_) {
            finish();
          }
        });
      },

      async speakSequence(items, options = {}) {
        const session = Number.isFinite(options.session) ? options.session : this.sessionId;
        const preDelay = Number.isFinite(options.preDelay) ? options.preDelay : 0;
        if (preDelay > 0) {
          await delay(preDelay);
          if (session !== this.sessionId) return;
        }

        for (const item of items) {
          if (session !== this.sessionId) return;
          const text = item && item.text ? item.text : "";
          const style = item && item.style ? item.style : "instruction";
          await this.speak(text, audioStyle(style), session);
          if (session !== this.sessionId) return;
          const pause = item && Number.isFinite(item.pause) ? item.pause : 0;
          if (pause > 0) {
            await delay(pause);
            if (session !== this.sessionId) return;
          }
        }
      },

      async playSequence(items, options = {}) {
        const restartDelay = Number.isFinite(options.restartDelay) ? options.restartDelay : 130;
        const extraDelay = Number.isFinite(options.preDelay) ? options.preDelay : 0;
        const session = this.stop();
        await delay(restartDelay + extraDelay);
        if (session !== this.sessionId) return;
        return this.speakSequence(items, { session });
      }
    };

    function audioStyle(type) {
      if (type === "letter") return { rate: 0.82, pitch: 1.05, volume: 1 };
      if (type === "positive") return { rate: 0.92, pitch: 1.10, volume: 1 };
      return { rate: 0.88, pitch: 1.05, volume: 1 };
    }

    function selectIndonesianVoice(voices = []) {
      if (!Array.isArray(voices) || voices.length === 0) return null;
      const exact = voices.find(v => String(v.lang).toLowerCase() === "id-id");
      if (exact) return exact;
      const idLang = voices.find(v => String(v.lang).toLowerCase().startsWith("id"));
      if (idLang) return idLang;
      const named = voices.find(v => /indonesia|indonesian/i.test(String(v.name)));
      return named || null;
    }

    function speakAsync(text, options = {}) {
      return audioManager.speak(text, options, audioManager.sessionId);
    }

    function speakSequence(items, options = {}) {
      return audioManager.playSequence(items, options);
    }

    function stopAudio() {
      return audioManager.stop();
    }

    function updateSpeakerUI() {
      document.querySelectorAll(".speaker").forEach(btn => {
        btn.classList.toggle("speaking", audioManager.isSpeaking);
        btn.setAttribute("aria-pressed", audioManager.isSpeaking ? "true" : "false");
      });
    }

    function scheduleAudio(items, wait = 600, viewToken = runtime.viewToken) {
      const session = audioManager.sessionId;
      (async () => {
        await delay(wait);
        if (runtime.viewToken !== viewToken || session !== audioManager.sessionId) return;
        await audioManager.speakSequence(items, { session });
      })();
    }

    if (audioManager.supported) {
      audioManager.refreshVoices();
      try {
        window.speechSynthesis.onvoiceschanged = () => audioManager.refreshVoices();
      } catch (_) {}
    }

    // ============================================================
    // REWARDS / BADGES
    // ============================================================
    function addStars(amount = 1) {
      const n = Math.max(0, safeInt(amount));
      state.stars = Math.max(0, safeInt(state.stars) + n);
      saveState();
    }

    function addDiamonds(amount = 1) {
      const n = Math.max(0, safeInt(amount));
      state.diamonds = Math.max(0, safeInt(state.diamonds) + n);
      saveState();
    }

    function addCorrect(amount = 1) {
      state.correctAnswers = Math.max(0, safeInt(state.correctAnswers) + Math.max(0, safeInt(amount)));
      saveState();
    }

    function completeGame() {
      state.gamesPlayed = Math.max(0, safeInt(state.gamesPlayed) + 1);
      addDiamonds(1);
      saveState();
      updateBadges();
    }

    function updateBadges() {
      const unlocked = new Set(state.badges);
      const newBadges = [];
      BADGES.forEach(badge => {
        let qualifies = false;
        try { qualifies = Boolean(badge.test(state)); } catch (_) { qualifies = false; }
        if (qualifies && !unlocked.has(badge.id)) {
          unlocked.add(badge.id);
          newBadges.push(badge);
        }
      });

      if (newBadges.length) {
        state.badges = [...unlocked];
        state.diamonds += newBadges.length * 2;
        saveState();
        runtime.badgeQueue.push(...newBadges);
        createCelebration(24);
        setTimeout(showNextBadgeModal, 260);
      }
    }

    function markLearned(letter) {
      if (!LETTERS.some(x => x.letter === letter)) return false;
      const before = state.learnedLetters.length;
      state.learnedLetters = [...new Set([...state.learnedLetters, letter])].slice(0, 26);
      const isNew = state.learnedLetters.length > before;
      saveState();
      if (isNew) {
        updateBadges();
        if (state.learnedLetters.length === 26) createCelebration(42);
      }
      return isNew;
    }

    // ============================================================
    // CELEBRATION / MODALS / TOASTS
    // ============================================================
    function createCelebration(count = 14) {
      const layer = document.getElementById("celebration-layer");
      if (!layer) return;
      const icons = ["🎉", "⭐", "✨", "🎊"];
      const amount = clamp(Number(count) || 12, 4, 48);
      for (let i = 0; i < amount; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        p.textContent = randomItem(icons);
        p.style.left = `${Math.random() * 100}%`;
        p.style.fontSize = `${14 + Math.random() * 18}px`;
        p.style.animationDuration = `${1.6 + Math.random() * 1.5}s`;
        p.style.animationDelay = `${Math.random() * .28}s`;
        p.style.setProperty("--drift", `${-70 + Math.random() * 140}px`);
        p.style.setProperty("--spin", `${-300 + Math.random() * 600}deg`);
        layer.appendChild(p);
        setTimeout(() => p.remove(), 3600);
      }
    }

    function showModal(html) {
      const root = document.getElementById("overlay-root");
      if (!root) return;
      root.innerHTML = `<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
    }

    function closeModal() {
      const root = document.getElementById("overlay-root");
      if (root) root.innerHTML = "";
    }

    function showNextBadgeModal() {
      const root = document.getElementById("overlay-root");
      if (!root || root.innerHTML.trim()) return;
      const badge = runtime.badgeQueue.shift();
      if (!badge) return;
      showModal(`
        <div class="big">${badge.icon}</div>
        <h2>Badge baru!</h2>
        <p><strong>${escapeHtml(badge.name)}</strong><br>Yeay! Kamu juga dapat 💎 +2.</p>
        <button class="primary-btn" data-action="close-badge">Keren! ✨</button>
      `);
    }

    function showToast(message, duration = 1800) {
      const old = document.querySelector(".toast");
      if (old) old.remove();
      if (runtime.toastTimer) clearTimeout(runtime.toastTimer);
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      runtime.toastTimer = setTimeout(() => toast.remove(), duration);
    }

    // ============================================================
    // NAVIGATION / RENDER
    // ============================================================
    function navigateTo(view, payload = {}) {
      runtime.viewToken += 1;
      stopAudio();
      runtime.isTransitioning = false;
      runtime.previousView = runtime.currentView;
      runtime.currentView = view;
      if (Number.isFinite(payload.letterIndex)) runtime.letterIndex = clamp(payload.letterIndex, 0, 25);
      renderApp();
      window.scrollTo({ top: 0, behavior: "auto" });
      afterRender(view);
    }

    function afterRender(view) {
      const token = runtime.viewToken;
      if (view === "home" && !runtime.homeGreeted) {
        runtime.homeGreeted = true;
        scheduleAudio([
          { text: "Halo! Aku Pipit.", pause: 500, style: "instruction" },
          { text: "Ayo belajar huruf sambil bermain!", pause: 0, style: "instruction" }
        ], 720, token);
      }

      if (view === "detail") scheduleAudio(detailAudioItems(LETTERS[runtime.letterIndex]), 620, token);
      if (view === "guess" && runtime.guess && !runtime.guess.finished) scheduleAudio(guessQuestionAudio(), 600, token);
      if (view === "find" && runtime.find && !runtime.find.finished) scheduleAudio(findQuestionAudio(), 600, token);
      if (view === "match" && runtime.match && !runtime.match.finished) scheduleAudio(matchIntroAudio(), 600, token);
      if (view === "first" && runtime.first && !runtime.first.finished) scheduleAudio(firstQuestionAudio(), 520, token);
    }

    function renderApp() {
      const app = document.getElementById("app");
      if (!app) return;
      const view = runtime.currentView;
      const noNav = ["splash", "onboarding"].includes(view);
      app.innerHTML = `<main class="app-shell ${noNav ? "no-nav" : ""}">${renderView(view)}${noNav ? "" : renderBottomNav()}</main>`;
      updateSpeakerUI();
    }

    function renderView(view) {
      switch (view) {
        case "splash": return renderSplash();
        case "onboarding": return renderOnboarding();
        case "home": return renderHome();
        case "learn": return renderLearn();
        case "detail": return renderLetterDetail();
        case "games": return renderGameMenu();
        case "guess": return renderGuessGame();
        case "find": return renderFindGame();
        case "match": return renderMatchGame();
        case "first": return renderFirstLetterGame();
        case "rewards": return renderRewards();
        case "parentGate": return renderParentGate();
        case "parent": return renderParentDashboard();
        default: return renderHome();
      }
    }

    // ============================================================
    // GAME MENU
    // ============================================================
    function renderGameMenu() {
      return `
        <section class="page">
          <div class="top-row">
            <div>
              <h1 class="page-title">🎮 Ayo Bermain</h1>

            </div>
            <div class="mascot small" aria-hidden="true">🐦</div>
          </div>

            ${gameCard("start-guess", "🔤", "TEBAK HURUF", "Dengar lalu pilih hurufnya.", "c1")}
            ${gameCard("start-find", "🔎", "CARI HURUF", "Cari huruf yang Pipit sebut.", "c2")}
            ${gameCard("start-match", "🧩", "PASANGKAN HURUF", "Huruf besar bertemu huruf kecil.", "c3")}
